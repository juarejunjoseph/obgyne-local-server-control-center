name: Build Windows test installer

on:
  workflow_dispatch:
  push:
    branches:
      - testing/electron-prototype

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build Windows x64 installer
        run: npm run dist:win

      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: OB-Gyne-Server-Control-Center-TEST-Windows-x64
          path: |
            dist/*Setup.exe
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
