name: Build Windows test installer

on:
  workflow_dispatch:
  push:
    branches:
      - testing/electron-prototype

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build Windows x64 installer
        run: npm run dist:win

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter '*Setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not created.' }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Windows installer failed with exit code $($process.ExitCode)." }
          $app = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Filter 'OB-Gyne Server Control Center TEST.exe' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw 'Installed application was not found.' }

      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: OB-Gyne-Server-Control-Center-TEST-Windows-x64
          path: |
            dist/*Setup.exe
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
